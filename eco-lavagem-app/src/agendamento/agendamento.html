 <div class="container">
    <div class="card">
      <div class="form-group">
        <label>Status</label>
        <select>
          <option>Todos os status</option>
          <option>Agendado</option>
          <option>Em andamento</option>
          <option>Concluído</option>
        </select>
      </div>

      <div class="form-group">
        <label>Profissional</label>
        <select>
          <option>Todos os profissionais</option>
          <option>Carlos</option>
          <option>Pedro</option>
          <option>Ana</option>
        </select>
      </div>

      <div class="form-group button-group">
        <button>
          🔎 Limpar Filtros
        </button>
      </div>
    </div>
  </div>

<!-- Button trigger modal -->
<button
  type="button"
  class="btn btn-primary"
  data-bs-toggle="modal"
  data-bs-target="#staticBackdrop"
>
  +Novo agendamento
</button>

<div class="session-cards">
  @for (agendamento of agendamentosList; track $index) {
    <div class="card">
      <div class="left">
        <div class="avatar">JS</div>

        <div class="info">
          <div class="name">{{ agendamento.nome }}</div>
          <div class="details">{{ agendamento.veiculo }} • {{ agendamento.servico }}</div>
        </div>
      </div>

      <div class="right">
        <div class="item">
          <span class="label">Hora</span>
          <span class="value">{{ agendamento.horario }}</span>
        </div>

        <div class="item">
          <span class="label">Profissional</span>
          <span class="value">{{ agendamento.profissional }}</span>
        </div>

        <div class="item">
          <span class="label">Status</span>
          <span class="status done"></span>
        </div>

        <div class="actions">
          <button
            data-bs-toggle="modal"
            data-bs-target="#staticBackdrop"
            (click)="selecionarId(agendamento.id)"
          >
            ✏️
          </button>

          <button
            class="icon delete"
            data-bs-toggle="modal"
            data-bs-target="#modalExclusao"
            (click)="selecionarId(agendamento.id)"
          >
            🗑️
          </button>
        </div>
      </div>
    </div>
  }
</div>

<!-- Modal formulário de cadastro -->
<div
  class="modal fade"
  id="staticBackdrop"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-labelledby="staticBackdropLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="staticBackdropLabel">Modal title</h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
          (click)="limparFormulario()"
        ></button>
      </div>
      <div class="modal-body">
        <div class="modal-body">
          <form [formGroup]="formAgendamento" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label>Nome</label>
              <input type="text" class="form-control" formControlName="nome" />
            </div>

            <div class="mb-3">
              <label>Veículo</label>
              <input type="text" class="form-control" formControlName="veiculo" />
            </div>

            <div class="mb-3">
              <label>Serviço</label>
              <input type="text" class="form-control" formControlName="servico" />
            </div>

            <div class="mb-3">
              <label>Horário</label>
              <input type="time" class="form-control" formControlName="horario" />
            </div>

            <div class="mb-3">
              <label>Profissional</label>
              <input type="text" class="form-control" formControlName="profissional" />
            </div>

            <div class="mb-3">
              <label>Status</label>
              <select class="form-control" formControlName="status">
                <option value="Pendente">Pendente</option>
                <option value="Em andamento">Em andamento</option>
                <option value="Concluido">Concluído</option>
              </select>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
                (click)="limparFormulario()"
              >
                Cancelar
              </button>

              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="formAgendamento.invalid"
                data-bs-dismiss="modal"
              >
                Salvar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- modal de confirmação/exclusão -->
<div
  class="modal fade"
  id="modalExclusao"
  tabindex="-1"
  aria-labelledby="modalExclusaolabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalExclusaolabel">Excluir Agendamento</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">Tem certeza que deseja excluir o registro?</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="onExcluir()">
          Excluir Registro
        </button>
      </div>
    </div>
  </div>
</div>
