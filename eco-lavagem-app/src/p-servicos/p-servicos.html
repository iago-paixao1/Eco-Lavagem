<div class="paige-container">
  <div class="header-action">
    <button
      type="button"
      class="btn btn-primary btn-cadastro"
      data-bs-toggle="modal"
      data-bs-target="#staticBackdrop"
    >
      +Cadastrar Serviço
    </button>
  </div>

  <div class="session-cards">
    @for (servicos of servicosList; track $index) {
      <div class="card-servicos">
        <div class="left">
          <div class="avatar"></div>

          <div class="info">
            <div class="name">{{ servicos.nome }}</div>
            <div class="item">{{ servicos.descricao }}</div>
            <div class="item">{{ servicos.tempo }}</div>
          </div>
        </div>

        <div class="right">
          <div class="item">
            <span class="label">{{ servicos.preco }}</span>
          </div>

          <div class="actions">
            <button
              data-bs-toggle="modal"
              data-bs-target="#staticBackdrop"
              (click)="selecionarId(servicos.id)"
            >
              ✏️
            </button>

            <button
              class="icon delete"
              data-bs-toggle="modal"
              data-bs-target="#modalExclusao"
              (click)="selecionarId(servicos.id)"
            >
              🗑️
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>

<!-- Modal formulário de cadastro -->
<div
  class="modal fade"
  id="staticBackdrop"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-labelledby="staticBackdropLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="staticBackdropLabel">Cadastrar Profissional</h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
          (click)="limparFormulario()"
        ></button>
      </div>
      <div class="modal-body">
        <div class="modal-body">
          <form [formGroup]="formServicos" (ngSubmit)="onSubmit()">
            <div class="campo">
              <label>Nome do Serviço</label>
              <input
                type="text"
                class="form-control"
                formControlName="nome"
                placeholder="Digite o nome do serviço"
              />
            </div>

            <div class="campo">
              <label>Descrição</label>
              <input
                type="text"
                class="form-control"
                formControlName="descricao"
                placeholder="Insira uma breve descrição sobre o serviço"
              />
            </div>

            <div class="campo">
              <label>Preço</label>
              <input
                type="text"
                class="form-control"
                formControlName="preco"
                placeholder="Apenas números"
              />
            </div>

            <div class="campo">
              <label>Tempo</label>
              <input
                type="text"
                class="form-control"
                formControlName="tempo"
                placeholder="Apenas números"
              />
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
                (click)="limparFormulario()"
              >
                Cancelar
              </button>

              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="formServicos.invalid"
                data-bs-dismiss="modal"
              >
                Salvar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- modal de confirmação/exclusão -->
<div
  class="modal fade"
  id="modalExclusao"
  tabindex="-1"
  aria-labelledby="modalExclusaolabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalExclusaolabel">Excluir Serviço</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">Tem certeza que deseja excluir o serviço selecionado?</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="onExcluir()">
          Excluir Serviço
        </button>
      </div>
    </div>
  </div>
</div>
